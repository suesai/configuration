tab_bar_edge               top
tab_bar_style              custom
# tab_bar.py: blank-area drag moves the OS window; blank double-click does nothing.
tab_bar_align              center
tab_bar_min_tabs           1
tab_bar_margin_width       8
tab_bar_margin_height      4 0
tab_bar_background         #1B1B1D
tab_bar_margin_color       #1B1B1D
tab_switch_strategy        previous
tab_title_max_length       0
inactive_tab_font_style    normal
active_tab_font_style      bold
active_tab_foreground      #F5F5F7
active_tab_background      #3A3A3F
inactive_tab_foreground    #A1A1A6
inactive_tab_background    #29292D
tab_activity_symbol        none
bell_on_tab                " "
# Every tab gets a dot after its index. A background command finishing in an
# inactive tab replaces that dot with the bell until the tab is focused.
tab_title_template         "{'⌘' if index <= 9 else ''}{index} {bell_symbol or '• '}{title}"
active_tab_title_template  "{'⌘' if index <= 9 else ''}{index} • {bell_symbol}{title}"

# Show the tab bell when a command lasting at least 5 seconds finishes while
# its tab is hidden. Keep command-finish notifications visual-only.
notify_on_cmd_finish       invisible 5.0 bell
enable_audio_bell          no
window_alert_on_bell       no
