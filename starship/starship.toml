format             = """
[╭─](fg:surface2 bold)\
$os\
[](fg:flamingo bg:mauve)\
$directory\
[](fg:mauve bg:maroon)\
($git_branch\
$git_status\
$git_commit\
[ ](bg:maroon))\
[](fg:maroon bg:yellow)\
($c\
$python\
$rust\
$golang\
$nodejs\
$kotlin\
$java\
$php\
$haskell\
[ ](bg:yellow))\
[](fg:yellow bg:teal)\
($conda\
$docker_context\
[ ](bg:teal))\
[](fg:teal)\
$fill\
[](fg:peach)\
$status\
[](fg:duration bg:peach)\
$cmd_duration\
[](fg:pink bg:duration)\
$username\
$hostname\
[](fg:rosewater bg:pink)\
$time\
[─╮](fg:surface2 bold)\
$line_break\
[╰─](fg:surface2 bold)\
$character\
"""
right_format       = """
[─╯](fg:surface2 bold)\
"""
command_timeout    = 1000
palette            = "tomorrow_night_mist"

[palettes.tomorrow_night_mist]
rosewater          = "#9fa9ae"
flamingo           = "#7fa5c6"
pink               = "#8399b0"
mauve              = "#a084b8"
red                = "#c47570"
maroon             = "#82a878"
peach              = "#c47570"
yellow             = "#c9ad62"
green              = "#82a878"
teal               = "#69a9a1"
sky                = "#91acb6"
sapphire           = "#879fb4"
blue               = "#dce6ee"
lavender           = "#e4dbe8"
duration           = "#bd8b52"
text               = "#d1d4d2"
subtext1           = "#d2d5d3"
subtext0           = "#b9bdbb"
overlay2           = "#8e9290"
overlay1           = "#777b79"
overlay0           = "#606462"
surface2           = "#494f55"
surface1           = "#363b40"
surface0           = "#23272b"
base               = "#1d1f21"
mantle             = "#181a1c"
crust              = "#1b1e20"

[os]
style              = "fg:crust bg:flamingo"
format             = "[ $symbol ]($style)"
disabled           = false

[os.symbols]
AIX                = "AIX"
Alpaquita          = "\uf26a" # "\uf26a" "" "\ue3a5\ue390" ""
AlmaLinux          = "\uf31d" # ""
Alpine             = "\uf300" # ""
Amazon             = "\uf270" # ""
Android            = "\ue70e" # ""
Arch               = "\uf303" # ""
Artix              = "\uf31f" # ""
CentOS             = "\uf304" # ""
Debian             = "\uf306" # ""
DragonFly          = "\ueef8" # "" "" "🐉"
Emscripten         = "\u26A1" # "⚡"
EndeavourOS        = "\uf322" # "" ""
Fedora             = "\uf30a" # ""
FreeBSD            = "\uf30c" # ""
Garuda             = "\uf337" # ""
Gentoo             = "\uf30d" # ""
HardenedBSD        = "\uf132" # ""
Illumos            = "\uf326" # "🐦"
Kali               = "\uf327" # ""
Linux              = "\uf17c" # ""
Mabox              = "\uf1b2" # "" "📦"
Macos              = "\uf302" # ""
Manjaro            = "\uf312" # ""
Mariner            = "\ue7ae" # "\ue7ae" ""
MidnightBSD        = "\ue3e0" # "🌘"
Mint               = "\uf30e" # ""
NetBSD             = "\u2691" # "⚑"
NixOS              = "\uf313" # ""
OpenBSD            = "\uf328" # ""
OpenCloudOS        = "\uf0c2" # ""
openEuler          = "\u2208" # "\u2208" "∈"
openSUSE           = "\uf314" # ""
OracleLinux        = "\u213A" # "\u213A" "℺" "⊂⊃" "\u2282\u2283"
Pop                = "\uf32a" # ""
Raspbian           = "\uf315" # ""
Redhat             = "\uf316" # "" "󱄛"
RedHatEnterprise   = "\uf316" # "" "󱄛"
RockyLinux         = "\uf32b" # ""
Redox              = "\uf331" # "" "󰺕"
Solus              = "\uf32d" # "" ""
SUSE               = "\uef6d" # ""
Ubuntu             = "\uf31b" # ""
Ultramarine        = "󱙳"      # "🔷"
Unknown            = "\uf108" # ""
Void               = "\uf32e" # "" ""
Windows            = "\uf17a" # ""

[directory]
read_only          = ""
read_only_style    = "fg:crust bg:mauve"
style              = "fg:crust bg:mauve"
format             = "[  $path ]($style)[$read_only]($read_only_style)"
truncation_length  = 0
truncate_to_repo   = false

[git_branch]
symbol             = "󰊢"
style              = "fg:crust bg:maroon"
format             = "[ $symbol $branch]($style)"

[git_status]
style              = "fg:crust bg:maroon"
ahead              = "$count"
behind             = "$count"
conflicted         = "=$count"
deleted            = "$count"
modified           = "!$count"
renamed            = "»$count"
staged             = "+$count"
stashed            = "\\$$count"
untracked          = "?$count"
format             = "[( $all_status$ahead_behind)]($style)"

[git_commit]
tag_symbol         = "󰓹 "
style              = "fg:crust bg:maroon"
format             = "[ ($tag )$hash]($style)"
commit_hash_length = 8
disabled           = false
tag_disabled       = false

[c]
symbol             = ""
style              = "fg:crust bg:yellow"
format             = "[ $symbol( $version)]($style)"

[golang]
symbol             = ""
style              = "fg:crust bg:yellow"
format             = "[ $symbol( $version)]($style)"

[haskell]
symbol             = ""
style              = "fg:crust bg:yellow"
format             = "[ $symbol( $version)]($style)"

[java]
symbol             = ""
style              = "fg:crust bg:yellow"
format             = "[ $symbol( $version)]($style)"

[kotlin]
symbol             = ""
style              = "fg:crust bg:yellow"
format             = "[ $symbol( $version)]($style)"

[nodejs]
symbol             = ""
style              = "fg:crust bg:yellow"
format             = "[ $symbol( $version)]($style)"

[php]
symbol             = ""
style              = "fg:crust bg:yellow"
format             = "[ $symbol( $version)]($style)"

[python]
symbol             = ""
style              = "fg:crust bg:yellow"
format             = '[ $symbol( $version)( \(#$virtualenv\))]($style)'

[rust]
symbol             = ""
style              = "fg:crust bg:yellow"
format             = "[ $symbol( $version)]($style)"

[conda]
symbol             = ""
style              = "fg:crust bg:teal"
format             = "[ $symbol $environment]($style)"
ignore_base        = false

[docker_context]
symbol             = ""
style              = "fg:crust bg:teal"
format             = "[ $symbol( $context)]($style)"

[fill]
symbol             = "─"
style              = "surface2 bold"

[status]
map_symbol         = false
symbol             = " "
success_symbol     = ""
style              = "fg:crust bg:peach"
format             = "[$symbol $status( \uf0a2 $signal_number-$signal_name) ]($style)"
disabled           = false

[cmd_duration]
style              = "fg:crust bg:duration"
format             = "[  $duration ]($style)"
show_milliseconds  = true
disabled           = false

[username]
style_root         = "fg:crust bg:pink bold"
style_user         = "fg:crust bg:pink"
format             = "[  $user]($style)"
show_always        = true

[hostname]
style              = "fg:crust bg:pink"
format             = "[@$hostname ]($style)"
ssh_only           = false
# ssh_symbol       = "@" # "\ue36e" "" "⇒" " " "ﬁ⇒"
disabled           = false

[time]
style              = "fg:crust bg:rosewater"
format             = "[ 󰥔 $time ]($style)"
disabled           = false

[character]
success_symbol            = "[❯](fg:green bold)"
error_symbol              = "[❯](fg:red bold)"
vimcmd_symbol             = "[❮](fg:green bold)"
vimcmd_replace_one_symbol = "[❮](fg:lavender bold)"
vimcmd_replace_symbol     = "[❮](fg:lavender bold)"
vimcmd_visual_symbol      = "[❮](fg:yellow) bold"
disabled                  = false
