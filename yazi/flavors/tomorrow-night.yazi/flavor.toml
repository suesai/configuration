# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{
[mgr]
cwd = { fg = "#8abeb7" } # 当前路径：复古青绿

# Hovered
hovered         = { reversed = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#f0c674", bold = true, italic = true, underline = true } # 黄
find_position = { fg = "#b294bb", bg = "reset", bold = true, italic = true }       # 紫

# Marker
marker_copied   = { fg = "#b5bd68", bg = "#b5bd68" } # 绿
marker_cut      = { fg = "#cc6666", bg = "#cc6666" } # 红
marker_marked   = { fg = "#8abeb7", bg = "#8abeb7" } # 青绿
marker_selected = { fg = "#f0c674", bg = "#f0c674" } # 黄

# Count
count_copied   = { fg = "#1d1f21", bg = "#b5bd68" }
count_cut      = { fg = "#1d1f21", bg = "#cc6666" }
count_selected = { fg = "#1d1f21", bg = "#f0c674" }

# Border
border_symbol = "│"
border_style  = { fg = "#707880" } # 中灰边框
# : }}}

# : Tabs {{{
[tabs]
active   = { fg = "#1d1f21", bg = "#81a2be", bold = true } # 激活标签：雾蓝底黑字
inactive = { fg = "#81a2be", bg = "#373b41" }             # 未激活：深灰底蓝字
# : }}}

# : Mode {{{
[mode]
# Normal mode
normal_main = { fg = "#1d1f21", bg = "#81a2be", bold = true } # 雾蓝
normal_alt  = { fg = "#81a2be", bg = "#373b41" }

# Select mode
select_main = { fg = "#1d1f21", bg = "#b5bd68", bold = true } # 柔绿
select_alt  = { fg = "#b5bd68", bg = "#373b41" }

# Unset mode
unset_main = { fg = "#1d1f21", bg = "#de935f", bold = true } # 浅橙
unset_alt  = { fg = "#de935f", bg = "#373b41" }
# : }}}

# : Status bar {{{
[status]
# Permissions
perm_sep   = { fg = "#707880" }
perm_type  = { fg = "#81a2be" } # 属性：雾蓝
perm_read  = { fg = "#f0c674" } # 读：黄
perm_write = { fg = "#cc6666" } # 写：红
perm_exec  = { fg = "#b5bd68" } # 执行：绿

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#81a2be", bg = "#373b41" }
progress_error  = { fg = "#81a2be", bg = "#cc6666" }
# : }}}

# : Pick {{{
[pick]
border   = { fg = "#81a2be" }
active   = { fg = "#b294bb", bold = true } # 幽紫
inactive = {}
# : }}}

# : Input {{{
[input]
border   = { fg = "#81a2be" }
title    = {}
value    = {}
selected = { reversed = true }
# : }}}

# : Completion {{{
[cmp]
border = { fg = "#81a2be" }
# : }}}

# : Tasks {{{
[tasks]
border  = { fg = "#81a2be" }
title   = {}
hovered = { fg = "#b294bb", bold = true }
# : }}}

# : Which {{{
[which]
mask            = { bg = "#373b41" }
cand            = { fg = "#8abeb7" }
rest            = { fg = "#969896" }
desc            = { fg = "#b294bb" }
separator       = "  "
separator_style = { fg = "#666666" }
# : }}}

# : Help {{{
[help]
on      = { fg = "#8abeb7" }
run     = { fg = "#b294bb" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#373b41", bg = "#c5c8c6" }
# : }}}

# : Spotter {{{
[spot]
border   = { fg = "#81a2be" }
title    = { fg = "#81a2be" }
tbl_col  = { fg = "#8abeb7" }
tbl_cell = { fg = "#b294bb", bg = "#373b41" }
# : }}}

# : Notification {{{
[notify]
title_info  = { fg = "#b5bd68" } # 绿
title_warn  = { fg = "#f0c674" } # 黄
title_error = { fg = "#cc6666" } # 红
# : }}}

# : File-specific styles {{{
[filetype]
rules = [
        # Image (图片 -> 优雅青绿)
        { mime = "image/*", fg = "#8abeb7" },
        # Media (音视频 -> 暖麦芽黄)
        { mime = "{audio,video}/*", fg = "#f0c674" },
        # Archive (压缩包 -> 幽粉紫)
        { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#b294bb" },
        # Document (文档 -> 柔和绿)
        { mime = "application/{pdf,doc,rtf}", fg = "#b5bd68" },
        # Virtual file system
        { mime = "vfs/*", fg = "#969896" },
        # Fallback
        { url = "*", fg = "#c5c8c6" },
        { url = "*/", fg = "#81a2be", bold = true }, # 文件夹高亮为经典雾蓝
        # TODO: remove
        { name = "*", fg = "#c5c8c6" },
        { name = "*/", fg = "#81a2be", bold = true }
]
# : }}}
